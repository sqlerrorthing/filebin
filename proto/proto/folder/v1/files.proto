syntax = "proto2";

package folder.v1;

import "folder/v1/common.proto";
import "folder/v1/encryption.proto";
import "google/protobuf/empty.proto";


service FilesService {
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc Download(DownloadRequest) returns (stream Blob);
  rpc Delete(DeleteRequest) returns (google.protobuf.Empty);

  rpc InitiateUpload(InitiateUploadRequest) returns (InitiateUploadResponse);
  rpc UploadChunk(UploadChunkRequest) returns (UploadChunkResponse);
}

message InitiateUploadRequest {
  required FileMetadata metadata = 1;
  required OwnedFolderRef folder = 2;
}

// UploadChunk rules:
// 1. All intermediate chunks MUST equal chunk_size.
// 2. A chunk with EncryptedVault marks the final chunk.
// 3. If chunk_data < chunk_size without EncryptedVault, upload fails.pnpm store prune
message UploadChunkRequest {
  required string upload_id = 1;
  optional EncryptedVault vault = 2;
  required bytes chunk_data = 3;
}

message InitiateUploadResponse {
  required string upload_id = 1;
  required uint32 chunk_size = 2;
}

message UploadChunkResponse {
  oneof result {
    google.protobuf.Empty continue = 1;
    FileView file = 2;
  }
}

message DeleteRequest {
  required OwnedFolderRef folder = 1;
  required FileId file_id = 2;
}

message DownloadRequest {
  required FolderId folder = 2;
  required FileId file = 1;
}

message Blob {
  required bytes part = 1;
}

message ListFilesRequest {
  required FolderId folder = 1;
}

message ListFilesResponse {
  repeated FileView files = 1;
}

message FileView {
  required FileId id = 3;
  required FileMetadata metadata = 1;
  required sint64 size = 2;
}

// Encrypted json payload
// Contains only path: string, type: string
message FileMetadata {
  required EncryptedBlobs value = 1;
}
