name: Build

on:
  pull_request:
  push:
    branches:
      - master
    paths:
      - 'proto/**'
      - 'backend/**'
      - 'frontend/**'

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'proto/**'
            
            frontend:
              - 'frontend/**'
              - 'proto/**'

  test-backend:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' 
      && github.ref != 'refs/heads/master'

    permissions:
      contents: read
      checks: write
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Doctests
        run: cd backend && cargo test --doc

      - uses: taiki-e/install-action@nextest

      - name: Tests
        run: cd backend && cargo nextest run --no-tests pass --profile ci

      - name: Report
        id: report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: 'backend/target/nextest/ci/test-results.xml'
          detailed_summary: true
          annotate_notice: true


  build-backend:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' 
    #  && github.event_name == 'push'
    #  && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache
        uses: actions/cache@v4
        id: cache
        with:
          path: cache-mount
          key: cache-mount-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cache-mount-${{ runner.os }}-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: backend/Dockerfile
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Build and push backend
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/sqlerrorthing/filebin:backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  build-frontend:
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true'
    #  && github.event_name == 'push'
    #  && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache
        uses: actions/cache@v4
        id: cache
        with:
          path: cache-mount
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: frontend/Dockerfile
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/sqlerrorthing/filebin:frontend
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (needs.build-backend.result == 'success' 
            || needs.build-frontend.result == 'success')

    steps:
      - run: |
          curl -X POST "https://${{ secrets.DEPLOY_SERVER }}/hooks/pull?token=${{ secrets.DEPLOY_TOKEN }}" \
            --fail \
            --show-error \
            --silent
