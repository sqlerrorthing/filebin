name: Build backend

on:
  pull_request:
  push:
    branches:
      - master
    paths:
      - 'proto/**'
      - 'backend/**'

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checking out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo build mounts
        id: cargo-cache
        uses: actions/cache@v5
        with:
          path: cache-mount
          key: cargo-build-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-build-${{ runner.os }}-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: backend/Dockerfile
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}

      - name: Build and push backend
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/sqlerrorthing/filebin:backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/sqlerrorthing/filebin:frontend
          cache-from: type=registry,ref=ghcr.io/sqlerrorthing/filebin:frontend-buildcache
          cache-to: type=registry,ref=ghcr.io/sqlerrorthing/filebin:frontend-buildcache,mode=max
